# Copy this file to config.toml and set one explicit recipient before using
# --send. Keep credentials in environment variables; this file is safe to
# commit and contains only public watchlist/source settings.

[storage]
path = "data"

[sources]
# Filing and IR lookback is bounded and repeated with this overlap so delayed
# SEC indexing or a transient failed run can be recovered.
lookback_days = 120
overlap_days = 14
bootstrap_lookback_days = 450
max_sec_filings_per_company = 30
max_relevant_8k_per_company = 10
max_periodic_exhibits = 0
max_assets_per_exhibit = 48
max_ir_pages = 8
max_ir_documents = 16
max_ir_retries = 2
ir_timeout = 20.0
max_ir_document_bytes = 31457280
lock_timeout = 0.0
ir_user_agent = "mortgage-servicing-brief/0.1 (+official-source-collection)"

[email]
# Fill these explicitly for delivery. Gmail uses an app password in
# SMTP_PASSWORD; ordinary account passwords are not accepted by Gmail.
sender = ""
recipient = ""
smtp_host = "smtp.gmail.com"
smtp_port = 465
smtp_security = "ssl"
smtp_username = ""
smtp_password_env = "SMTP_PASSWORD"
max_message_bytes = 15728640

[ai]
enabled = false
model = ""
prompt_version = "servicing-brief-v1"
# Optional narrative generation is bounded per pipeline run.  The worker
# enforces the hard caps even when a larger value is supplied at runtime.
max_requests_per_run = 4
max_input_chars = 14000
max_output_chars = 1200
retries = 1

[schedule]
timezone = "America/New_York"
times = ["07:00", "18:00"]
enabled = false

# Core proof set: Truist and PennyMac Financial Services.
[[companies]]
ticker = "TFC"
name = "Truist Financial Corporation"
cik = "0000092230"
enabled = true
ir_url = "https://ir.truist.com/earnings"
ir_pages = ["https://ir.truist.com/earnings", "https://ir.truist.com/events-and-presentation"]
reporting_boundary = "Diversified bank; report mortgage servicing separately from mortgage production and consolidated bank results."

